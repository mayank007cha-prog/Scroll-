<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- fold:start -->
<title>Mayank Chauhan Portfolio</title>
<meta name="description" content="Mayank Chauhan, an animator turned UI/UX designer. From making things move to making things work.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
  /* Layout: one screen. Nav on top, then two columns: the statement on the left,
     the film on the right, bleeding toward the edge and melting into the page.
     Dark only. */
  :root {
    --bg: #0b0b10;
    --fg: #f4f4f8;
    --muted: #b7b7c6;
    --line: rgba(255, 255, 255, 0.16);
    --chip: rgba(255, 255, 255, 0.045);
    --accent: #8b8cf8;
    --work: #8c8cae;
    --font: "Geist", "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    --serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .page {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    overflow: clip;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .shell { width: 100%; max-width: 1140px; margin: 0 auto; }

  /* Nav */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 16px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .brand svg { width: 22px; height: 22px; }
  .links { display: flex; gap: 38px; font-size: 14.5px; color: var(--muted); }
  .links a { transition: color 0.2s ease; }
  .links a:hover { color: var(--fg); }
  .actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn, .cta {
    height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; font: inherit; cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
  }
  .icon-btn { width: 44px; padding: 0; }
  .icon-btn svg { width: 17px; height: 17px; }
  .cta { padding: 0 20px; gap: 12px; font-weight: 600; font-size: 14.5px; }
  .cta svg { width: 11px; height: 11px; transition: transform 0.25s ease; }
  .icon-btn:hover, .cta:hover { border-color: var(--accent); }
  .cta:hover svg { transform: translate(2px, -2px); }


  /* Hero */
  .hero {
    display: grid; grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr); align-items: center; gap: 8px;
    padding-block: clamp(16px, 4vh, 56px) clamp(32px, 7vh, 88px);
  }
  .copy { position: relative; z-index: 2; display: grid; justify-items: start; gap: 0; min-width: 0; }
  .tag {
    display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); font-size: 13.5px; color: var(--muted);
  }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 {
    margin: 26px 0 0; font-weight: 500; font-size: clamp(2.15rem, 3.95vw, 3.4rem); line-height: 1.07;
    letter-spacing: -0.042em; text-wrap: balance;
  }
  h1 span { display: block; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; color: var(--work); font-size: 1.07em; line-height: 0.9; }
  .lede { margin: 24px 0 0; max-width: 29em; font-size: clamp(0.98rem, 1.15vw, 1.06rem); line-height: 1.65; color: var(--muted); }
  .scroll { margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); }
  .scroll i { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); display: grid; place-items: center; }
  .scroll svg { width: 12px; height: 12px; animation: nudge 2.4s cubic-bezier(.65, 0, .35, 1) infinite; }
  .scroll:hover { color: var(--fg); }
  @keyframes nudge { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }

  /* The film. Its edges are feathered away so it never reads as a rectangle. */
  .stage {
    --bleed: clamp(0px, 6vw, 96px);
    position: relative; width: calc(100% + var(--bleed)); margin-right: calc(-1 * var(--bleed));
    aspect-ratio: 16 / 9; justify-self: stretch;
  }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.9s ease;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 8%, #000 24%, #000 76%, rgba(0,0,0,.35) 92%, transparent 100%), linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.4) 7%, #000 21%, #000 80%, rgba(0,0,0,.4) 93%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 8%, #000 24%, #000 76%, rgba(0,0,0,.35) 92%, transparent 100%), linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.4) 7%, #000 21%, #000 80%, rgba(0,0,0,.4) 93%, transparent 100%);
    mask-composite: intersect;
  }
  .stage.is-ready video { opacity: 1; }
  /* Anything in the film darker than the page takes the page colour, so there is no box */
  .stage.is-ready video { mix-blend-mode: lighten; }
  .stage .toggle {
    position: absolute; right: 19%; bottom: 13%; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--chip); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.25s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .stage:hover .toggle, .stage .toggle:focus-visible, .stage.is-paused .toggle { opacity: 1; }
  .stage .toggle:hover { color: var(--fg); border-color: var(--accent); }
  .stage .toggle svg { width: 11px; height: 11px; }
  .stage.is-paused .i-pause, .stage:not(.is-paused) .i-play { display: none; }

  @media (max-width: 900px) {
    .links { display: none; }
    .hero { grid-template-columns: minmax(0, 1fr); gap: 4px; padding-block: 28px 40px; }
    .stage { width: calc(100% + 48px); margin: 0 -24px; }
    .stage .toggle { opacity: 1; right: 7%; bottom: 0; }
  }
  @media (max-width: 420px) {
    .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .brand span { font-size: 15px; }
    .cta { padding: 0 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll svg { animation: none; }
    body, .stage video { transition: none; }
  }
</style>
<!-- fold:head-end -->
</head>
<body>
<!-- fold:body-start -->
<div class="page">
  <header class="shell nav">
    <a class="brand" href="#top" aria-label="Mayank Chauhan, home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>
      <span>Mayank Chauhan</span>
    </a>
    <nav class="links" aria-label="Primary">
      <a href="#work">Work</a>
      <a href="#concepts">Concepts</a>
      <a href="#about">About</a>
      <a href="#resume">Resume</a>
    </nav>
    <div class="actions">
      <a class="cta" href="#contact">Let's talk
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l7-7M4 2.5h5.5V8"/></svg>
      </a>
    </div>
  </header>

  <main class="shell hero" id="top">
    <div class="copy">
      <span class="tag">UI/UX Designer</span>
      <h1>
        <span>From making</span>
        <span>things move</span>
        <span>to making</span>
        <span>things <em>work.</em></span>
      </h1>
      <p class="lede">I'm Mayank, an animator turned UI/UX designer. I design product features that solve real problems, and interaction concepts for the apps I use every day.</p>
      <a class="scroll" href="#work">
        <i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 1.5v9M2.5 7 6 10.5 9.5 7"/></svg></i>
        Scroll to explore
      </a>
    </div>

    <div class="stage" id="stage">
      <video id="heroVideo" muted loop playsinline preload="auto" poster="hero/hero-poster.jpg"
             aria-label="Looping film: a bouncing ball becomes a row of loading dots, the dots become fingertips drumming on a desk, the camera pulls back to Mayank at his laptop, then pushes into the screen where the same ball is bouncing.">
        <source src="hero/hero-loop.mp4" type="video/mp4">
      </video>
      <button class="toggle" id="loopBtn" type="button" aria-label="Pause animation">
        <svg class="i-pause" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2.5" y="2" width="2.4" height="8" rx="1"/><rect x="7.1" y="2" width="2.4" height="8" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3.2 1.9v8.2a.6.6 0 0 0 .9.5l6.5-4.1a.6.6 0 0 0 0-1L4.1 1.4a.6.6 0 0 0-.9.5Z"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var video = document.getElementById('heroVideo');
  var loopBtn = document.getElementById('loopBtn');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── Film: loops forever; its last frame is its first frame, so the restart is invisible
  var wantPlay = !reduced, onScreen = true;
  function ready() { stage.classList.add('is-ready'); }
  video.addEventListener('loadeddata', ready); setTimeout(ready, 1500);
  if (video.readyState >= 2) ready();
  function sync() {
    var go = wantPlay && onScreen && !document.hidden;
    stage.classList.toggle('is-paused', !wantPlay);
    loopBtn.setAttribute('aria-label', wantPlay ? 'Pause animation' : 'Play animation');
    if (go) {
      var pr = video.play();
      if (pr && pr.catch) pr.catch(function () { wantPlay = false; sync(); });   // autoplay refused: show the play button
    } else { video.pause(); }
  }
  loopBtn.addEventListener('click', function () { wantPlay = !wantPlay; sync(); });
  if (window.IntersectionObserver) new IntersectionObserver(function (es) { onScreen = es[0].isIntersecting; sync(); }).observe(stage);
  document.addEventListener('visibilitychange', sync);
  sync();
})();
</script>
<!-- fold:body-end -->
</body>
</html>
