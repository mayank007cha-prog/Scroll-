plugins {
    id "com.android.application"
}

android {
    namespace "com.example.fibercheckout"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fibercheckout"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "Build APK" output installs directly on a test phone.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
