<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Board, Your Vibe</title>
  <meta name="description" content="Scroll to lift a new mechanical keyboard onto the desk — the whole setup relights to match.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/bg-ember.webp" imagesrcset="assets/bg-ember.webp 2048w, assets/bg-ember@2x.webp 4096w" imagesizes="(max-aspect-ratio: 1/1) 220vw, 100vw">
  <link rel="preload" as="image" href="assets/kb-ember.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!--
      Scroll-driven keyboard showcase.
      .kb-scene is laid out in the photos' own pixel space (2048x1144) and
      scaled to cover the viewport, so keyboards, light and the hand mask line
      up with the photo at every screen size.
      Layer order (bottom → top): environment photos, key-light, the board at
      rest, hands (masked copy of the photos), depth of field, monitor
      (headline on screen), mist, boards in motion.
    -->
    <section class="kb-hero" id="showcase" aria-label="Keyboard showcase">
      <div class="kb-sticky">
        <div class="kb-scene" id="scene">
          <div class="kb-env" aria-hidden="true">
            <img class="kb-bg" src="assets/bg-ember.webp" srcset="assets/bg-ember.webp 2048w, assets/bg-ember@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
            <img class="kb-bg" src="assets/bg-frost.webp" srcset="assets/bg-frost.webp 2048w, assets/bg-frost@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
            <img class="kb-bg" src="assets/bg-prism.webp" srcset="assets/bg-prism.webp 2048w, assets/bg-prism@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
          </div>

          <div class="kb-spot" aria-hidden="true"></div>

          <div class="kb-layer" id="layer-rest"></div>

          <div class="kb-hands" aria-hidden="true">
            <img class="kb-bg" src="assets/bg-ember.webp" srcset="assets/bg-ember.webp 2048w, assets/bg-ember@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
            <img class="kb-bg" src="assets/bg-frost.webp" srcset="assets/bg-frost.webp 2048w, assets/bg-frost@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
            <img class="kb-bg" src="assets/bg-prism.webp" srcset="assets/bg-prism.webp 2048w, assets/bg-prism@2x.webp 4096w" sizes="(max-aspect-ratio: 1/1) 220vw, 100vw" alt="" decoding="async">
          </div>

          <!-- Depth of field: the room softly blurred and dimmed around a
               clear zone on the keyboard, hands and desk. -->
          <div class="kb-dof" aria-hidden="true"></div>

          <!-- Monitor: the headline is the screen content. Above the depth of
               field so it stays sharp. -->
          <div class="kb-screen">
            <h1 class="kb-headline">
              <span>Your board.</span>
              <span class="kb-headline-alt">Your vibe.</span>
            </h1>
          </div>

          <div class="kb-mist" aria-hidden="true">
            <div class="kb-mist-sheet kb-mist-a"></div>
            <div class="kb-mist-sheet kb-mist-b"></div>
          </div>

          <div class="kb-layer" id="layer-move">
            <div class="kb-board" data-w="732">
              <div class="kb-shadow"></div>
              <div class="kb-ao"></div>
              <img src="assets/kb-ember.webp" alt="Royal Kludge RK R87 Pro keyboard" decoding="async">
              <div class="kb-tint" style="--kb: url(assets/kb-ember.webp)"></div>
              <div class="kb-sheen" style="--kb: url(assets/kb-ember.webp)"></div>
            </div>
            <div class="kb-board" data-w="741">
              <div class="kb-shadow"></div>
              <div class="kb-ao"></div>
              <img src="assets/kb-frost.webp" alt="Royal Kludge RK G87 keyboard" decoding="async">
              <div class="kb-tint" style="--kb: url(assets/kb-frost.webp)"></div>
              <div class="kb-sheen" style="--kb: url(assets/kb-frost.webp)"></div>
            </div>
            <div class="kb-board" data-w="719">
              <div class="kb-shadow"></div>
              <div class="kb-ao"></div>
              <img src="assets/kb-prism.webp" alt="Keychron V1 keyboard" decoding="async">
              <div class="kb-tint" style="--kb: url(assets/kb-prism.webp)"></div>
              <div class="kb-sheen" style="--kb: url(assets/kb-prism.webp)"></div>
            </div>
          </div>
        </div>

        <div class="kb-shade" aria-hidden="true"></div>

        <!-- Minimal progress rail: one hairline per board, the active one grows. -->
        <nav class="kb-rail" aria-label="Keyboards">
          <button type="button" aria-label="Royal Kludge RK R87 Pro"><span></span></button>
          <button type="button" aria-label="Royal Kludge RK G87"><span></span></button>
          <button type="button" aria-label="Keychron V1"><span></span></button>
        </nav>

        <div class="kb-dock">
          <div class="kb-products" aria-live="polite">
            <p class="kb-product" data-href="https://meckeys.com/shop/keyboard/80-keyboard/royal-kludge-rk-r87-pro/">
              <strong>Royal Kludge RK R87 Pro</strong><span>From ₹5,599</span>
            </p>
            <p class="kb-product" data-href="https://meckeys.com/shop/keyboard/80-keyboard/royal-kludge-rk-g87/">
              <strong>Royal Kludge RK G87</strong><span>From ₹3,799</span>
            </p>
            <p class="kb-product" data-href="https://meckeys.com/shop/keyboard/75-keyboard/keychron-v1/">
              <strong>Keychron V1</strong><span>From ₹5,999</span>
            </p>
          </div>
          <a class="kb-cta" id="cta" href="https://meckeys.com/shop/keyboard/80-keyboard/royal-kludge-rk-r87-pro/" target="_blank" rel="noopener">Shop now <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
