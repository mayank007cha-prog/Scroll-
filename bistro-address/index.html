<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bistro Address Switch</title>
<meta name="description" content="Concept: surface serviceable saved addresses on Bistro's 'Hang tight' screen and sort them first in the location sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #13a24b;
    --green-chip: #e8f7ee;
    --ink: #1c1c1c;
    --ink-2: #3c4250;
    --muted: #5f6673;
    --muted-2: #7a808a;
    --muted-3: #9aa0a8;
    --line: #eef0f2;
    --border: #e5e7eb;
    --border-soft: #f0f1f3;
    --tile: #f2f5f7;
    --sheet-bg: #f3f5f9;
    --off-chip: #eef0f3;
    --off-ink: #6b7280;
    --off-name: #8a9099;
    --page: #ececef;
    --page-ink: #1c1c1c;
    --page-muted: #5f6673;
    --page-card: #ffffff;
    --page-line: #dcdde2;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1e1f22;
      --page-ink: #f2f3f5;
      --page-muted: #a3a8b2;
      --page-card: #2a2c30;
      --page-line: #34363b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #1e1f22;
    --page-ink: #f2f3f5;
    --page-muted: #a3a8b2;
    --page-card: #2a2c30;
    --page-line: #34363b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Figtree", system-ui, -apple-system, sans-serif;
    background: var(--page);
    color: var(--page-ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }

  /* ---------- Page layout: the phone scales to fit the viewport ---------- */
  html, body { height: 100%; overflow: hidden; }
  .stage {
    height: 100%;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .fit { width: calc(360px * var(--s, 1)); height: calc(var(--ph, 780px) * var(--s, 1)); }

  /* ---------- Phone ---------- */
  .phone {
    position: relative;
    width: 360px;
    height: var(--ph, 780px);
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 0 0 10px #111, 0 30px 80px rgba(0,0,0,.35);
    isolation: isolate;
    transform: scale(var(--s, 1));
    transform-origin: 0 0;
  }
  .compact .phone { border-radius: 0; box-shadow: none; }
  body.compact { background: #fff; }

  .screen {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
    transition: opacity .35s var(--ease-out), transform .45s var(--ease-out);
  }
  .screen::-webkit-scrollbar { display: none; }
  .screen[hidden] { display: block; opacity: 0; transform: scale(.98); pointer-events: none; }

  /* Status bar */
  .status {
    height: 36px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .status .icons { display: flex; align-items: center; gap: 5px; }
  .batt {
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 2px 5px 2px 4px; border-radius: 6px; display: flex; gap: 2px; align-items: center;
  }

  /* ---------- Shared header ---------- */
  .hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 14px 0;
    height: 64px;
  }
  .tile {
    width: 48px; height: 54px; border-radius: 10px;
    display: grid; place-items: center; text-align: center;
    font-weight: 900; font-style: italic; text-transform: uppercase; line-height: .9;
    flex-shrink: 0;
  }
  .addr-btn { flex: 1; min-width: 0; text-align: left; padding-left: 4px; }
  .addr-btn .kicker {
    display: flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  }
  .addr-btn .line {
    display: block; font-size: 17px; line-height: 1.15; font-weight: 500;
  }
  .addr-btn .caret { display: inline-block; vertical-align: middle; margin-left: 4px; }
  .round {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; flex-shrink: 0;
  }

  /* ---------- Screen 1: Unserviceable landing ---------- */
  .landing-top {
    background: linear-gradient(90deg, #00c072 0%, #00cd7a 50%, #01b667 100%);
    color: #1f2530;
  }
  .landing-top .tile { background: #2b2e36; color: #fff; font-size: 8.5px; letter-spacing: .03em; line-height: 1; }
  .landing-top .round { background: #fff; }
  .hero {
    display: block; width: 100%; height: auto; margin-top: -2px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
  }
  .hero-wrap {
    background:
      linear-gradient(90deg, #00c072 0%, #00cd7a 50%, #01b667 100%) top / 100% 40px no-repeat,
      #fff;
  }

  .serviceable { padding-top: 2px; }
  .serviceable[hidden] { display: none; }
  .sv-head { padding: 0 16px; }
  .sv-title { display: flex; align-items: center; }
  .sv-title h2 { flex: 1; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .view-all {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 14px; font-weight: 600; color: var(--green);
  }
  .sv-sub { margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .carousel {
    display: flex; gap: 10px;
    padding: 12px 16px 10px;
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .mini {
    width: 136px; flex-shrink: 0; scroll-snap-align: start;
    background: #fff; border: 1px solid var(--border-soft); border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
    padding: 10px 12px 12px 10px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    text-align: left;
    opacity: 0; transform: translateY(10px);
    animation: rise .5s var(--ease-out) forwards;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .mini:active { transform: scale(.96); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .mini .lbl { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .mini .ad {
    width: 100%; font-size: 14px; color: var(--muted-2); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini.more {
    justify-content: center; align-items: center; gap: 8px;
    color: var(--green); font-weight: 600; font-size: 14px; width: 104px;
  }
  .mini.more .arrow {
    width: 34px; height: 34px; border-radius: 50%; background: var(--green-chip);
    display: grid; place-items: center;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .eta {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--green-chip); color: var(--green);
    font-size: 12px; font-weight: 600; line-height: 1.3;
    padding: 4px 9px 4px 7px; border-radius: 8px;
  }

  .help { margin-top: 10px; }
  .help-row {
    width: 100%; height: 58px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; text-align: left;
    border-bottom: 1px solid var(--line);
    font-size: 15px; font-weight: 500;
  }
  .help-row .ic {
    width: 34px; height: 34px; border-radius: 50%; background: var(--tile);
    display: grid; place-items: center; color: #4b5260;
  }
  .help-row .t { flex: 1; }
  .home-ind { height: 34px; display: grid; place-items: center; }
  .home-ind::after { content: ""; width: 128px; height: 4px; border-radius: 2px; background: #b9bcc2; }

  /* ---------- Sheet ---------- */
  .scrim {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .close-x {
    position: absolute; z-index: 22; left: 50%; top: 88px;
    width: 38px; height: 38px; margin-left: -19px; border-radius: 50%;
    background: #1c1c1c; color: #fff; display: grid; place-items: center;
    opacity: 0; transform: scale(.6) translateY(20px);
    transition: opacity .25s ease, transform .4s var(--ease-spring);
    pointer-events: none;
  }
  .sheet-open .close-x { opacity: 1; transform: none; pointer-events: auto; transition-delay: .08s; }
  .sheet {
    position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; top: 144px;
    background: var(--sheet-bg);
    border-radius: 18px 18px 0 0;
    transform: translateY(105%);
    transition: transform .5s var(--ease-out);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-open .sheet { transform: none; }
  .sheet-scroll {
    flex: 1; overflow-y: auto; padding: 0 12px 32px;
    scrollbar-width: none; overscroll-behavior: contain;
  }
  .sheet-scroll::-webkit-scrollbar { display: none; }
  .sheet-head {
    position: sticky; top: 0; z-index: 2;
    background: var(--sheet-bg);
    padding: 16px 0 12px;
  }
  .sheet-head h3 { font-size: 18px; font-weight: 700; padding-left: 0; line-height: 1.35; }
  .search {
    margin-top: 12px; height: 48px; border-radius: 12px; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
  }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink);
  }
  .search input::placeholder { color: #6b7280; }

  .card { background: #fff; border-radius: 16px; }
  .opts { margin-bottom: 12px; }
  .opt {
    width: 100%; height: 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; color: var(--green); font-size: 15px; font-weight: 600; text-align: left;
  }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt span { flex: 1; }
  .opt .chev { color: #8a9099; }
  .import {
    display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 12px;
  }
  .blinkit {
    width: 32px; height: 32px; border-radius: 7px; background: #f8cb46;
    display: grid; place-items: center; font-size: 8px; font-weight: 800; color: #0c831f; letter-spacing: -.02em;
  }
  .import .txt { flex: 1; }
  .import .t1 { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .import .t2 { font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
  .import button { color: var(--green); font-weight: 600; font-size: 14px; }

  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 18px 4px 10px;
  }
  .group-label .count {
    font-weight: 700; letter-spacing: 0; font-size: 11px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0 6px;
  }
  .group-label.live { color: var(--green); }

  .addr {
    display: flex; gap: 14px; padding: 12px 12px 14px; margin-bottom: 12px;
    text-align: left; width: 100%;
    animation: rise .45s var(--ease-out) both;
    transition: transform .15s ease;
  }
  .addr:active { transform: scale(.985); }
  .itile {
    width: 56px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    flex-shrink: 0; align-self: flex-start; background: #fff;
  }
  .itile .ico { height: 30px; background: var(--tile); display: grid; place-items: center; color: var(--green); }
  .itile .km { font-size: 10px; font-weight: 500; text-align: center; padding: 3px 0 4px; line-height: 1.35; }
  .addr .det { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .addr .name-row { width: 100%; display: flex; align-items: center; }
  .addr .name { flex: 1; font-size: 18px; font-weight: 700; line-height: 1.35; }
  .pin {
    width: 22px; height: 22px; border-radius: 11px; border: 1px solid var(--border);
    display: grid; place-items: center; color: #4b5260;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 6px; border-radius: 6px;
    font-size: 12px; font-weight: 600; line-height: 1.35;
    background: var(--green-chip); color: var(--green);
  }
  .addr .full { font-size: 14px; line-height: 1.35; color: var(--muted); }
  .addr .phone-no { font-size: 14px; line-height: 1.35; color: var(--muted); }
  .addr .phone-no b { color: var(--ink-2); letter-spacing: .08em; }
  .acts { display: flex; gap: 12px; padding-top: 2px; }
  .act {
    width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--green);
  }
  .addr.off .itile .ico { color: #9aa0a8; }
  .addr.off .name { color: var(--off-name); }
  .addr.off .chip { background: var(--off-chip); color: var(--off-ink); }
  .addr.off .full, .addr.off .phone-no, .addr.off .phone-no b { color: var(--muted-3); }
  .addr.current .itile .ico { background: var(--green); color: #fff; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }

  /* ---------- Screen 2: Serviceable home ---------- */
  .home-top {
    background: linear-gradient(180deg, #23955f 0%, #157a47 55%, #0d7142 100%);
    color: #fff;
    padding-bottom: 12px;
  }
  .home-top .tile { background: #0c5230; color: #fff; }
  .home-top .tile .n { font-size: 26px; display: block; }
  .home-top .tile .m { font-size: 12px; display: block; margin-top: 1px; }
  .home-top .round { background: #0c5230; color: #fff; }
  .home-top .addr-btn .line { font-size: 17px; font-weight: 500; }
  .home-top .addr-btn .line b { font-weight: 800; text-transform: uppercase; }
  .search-row { display: flex; gap: 10px; padding: 8px 12px 0; }
  .hsearch {
    flex: 1; height: 46px; background: #fff; border-radius: 14px;
    box-shadow: 0 3px 0 #1a2c22;
    display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; color: #1c1c1c;
  }
  .hsearch span { flex: 1; color: #5b6b86; font-size: 15px; }
  .hsearch .sep { width: 1px; height: 26px; background: #e5e7eb; flex: none; }
  .veg {
    width: 50px; height: 46px; background: #fff; border-radius: 12px;
    box-shadow: 0 3px 0 #1a2c22; color: #3c4250;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 12px; font-weight: 800;
  }
  .veg i { width: 32px; height: 18px; border-radius: 9px; background: #e3e5e8; position: relative; }
  .veg i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .feed { display: block; width: 100%; height: auto; }
  .free {
    display: flex; align-items: center; gap: 12px;
    margin: 0; padding: 14px 16px 10px;
    background: #f7f9ff; border-radius: 16px 16px 0 0;
  }
  .free .ic { width: 40px; height: 40px; border-radius: 10px; background: #fff; display: grid; place-items: center; color: #2f55d4; }
  .free b { display: block; color: #2f55d4; font-size: 14px; font-weight: 700; }
  .free span { font-size: 13px; color: var(--ink-2); }

  /* Toast */
  .toast {
    position: absolute; z-index: 30; left: 16px; right: 16px; bottom: 44px;
    background: #1c1c1c; color: #fff; border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
    font-size: 14px; line-height: 1.3;
    transform: translateY(140%); opacity: 0;
    transition: transform .45s var(--ease-spring), opacity .25s ease;
  }
  .toast.show { transform: none; opacity: 1; }
  .toast .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .toast .t { flex: 1; }
  .toast button { color: #6ee7a0; font-weight: 700; font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<script>
  // Placeholder data: labels and areas only, no real names, house numbers or phone numbers.
  const ADDRESSES = [
    { id: 'work',    label: 'Work',      icon: 'briefcase', short: 'Phase 8B, Industrial Area, Mohali', full: 'Industrial Area, Phase 8B, Sector 74, Mohali, Punjab', km: "You're here", eta: null },
    { id: 'home',    label: 'Home',      icon: 'home',      short: 'Sector 91, Mohali',            full: 'Yoga Park Road, Sector 91, Mohali, Punjab',            km: '1.4 km',  eta: null },
    { id: 'parents', label: 'Parents',   icon: 'heart',     short: 'Hisar Road, Sirsa',            full: 'Near Bus Stand, Hisar Road, Sirsa, Haryana',            km: '238 km',  eta: null },
    { id: 'gym',     label: 'Gym',       icon: 'dumbbell',  short: 'Sector 20, Panchkula',         full: 'Market Complex, Sector 20, Panchkula, Haryana',         km: '14 km',   eta: null },
    { id: 'other',   label: 'Other',     icon: 'mappin',    short: 'Galleria Market, Gurugram', full: 'Galleria Market Road, DLF Phase 4, Sector 28, Gurugram, Haryana', km: '268 km', eta: 10 },
    { id: 'family',  label: 'Family',    icon: 'users',     short: 'Hauz Khas, New Delhi',         full: 'Hauz Khas Enclave, Hauz Khas, New Delhi, Delhi',         km: '252 km',  eta: 14 },
    { id: 'hotel',   label: 'Hotel',     icon: 'bed',       short: 'Cyber City, Gurugram',         full: 'DLF Cyber City, DLF Phase 2, Gurugram, Haryana',         km: '266 km',  eta: 18 },
    { id: 'friends', label: 'Friends',   icon: 'users',     short: 'Rajouri Garden, New Delhi',    full: 'Rajouri Garden Main Market, New Delhi, Delhi',           km: '258 km',  eta: 22 },
  ];
  const MASKED_PHONE = '••••• •••••';
  const MAX_CARDS = 4;

  let currentId = 'work';
  let previousId = null;

  const $ = (s, r = document) => r.querySelector(s);
  const phone = $('#phone');
  const byId = id => ADDRESSES.find(a => a.id === id);
  const icon = (name, size) => `<svg width="${size}" height="${size}"><use href="#i-${name}"/></svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Serviceable first (fastest ETA first), then the rest in saved order.
  function sorted(list) {
    const live = list.filter(a => a.eta != null).sort((a, b) => a.eta - b.eta);
    const off = list.filter(a => a.eta == null);
    return { live, off };
  }

  function renderCarousel() {
    const { live } = sorted(ADDRESSES.filter(a => a.id !== currentId));
    const section = $('#serviceable');
    section.hidden = live.length === 0;
    if (!live.length) return;
    $('#sv-sub').textContent = `Bistro is live at ${live.length} of your saved address${live.length === 1 ? '' : 'es'}`;
    const cards = live.slice(0, MAX_CARDS).map((a, i) => `
      <button class="mini" type="button" data-pick="${a.id}" style="animation-delay:${120 + i * 70}ms">
        <span class="eta">${icon('bolt', 12)}${a.eta} mins</span>
        <span class="lbl">${esc(a.label)}</span>
        <span class="ad">${esc(a.short)}</span>
      </button>`).join('');
    const more = live.length > MAX_CARDS ? `
      <button class="mini more" type="button" data-open-sheet="saved" style="animation-delay:${120 + MAX_CARDS * 70}ms">
        <span class="arrow">${icon('chev', 18)}</span>View all
      </button>` : '';
    $('#carousel').innerHTML = cards + more;
    $('#carousel').scrollLeft = 0;
  }

  function addrCard(a, i) {
    const live = a.eta != null;
    const chip = live
      ? `<span class="chip">${icon('bolt', 12)}Delivers in ${a.eta} mins</span>`
      : `<span class="chip">${icon('clock', 12)}Bistro not live here yet</span>`;
    return `
      <div class="card addr${live ? '' : ' off'}${a.id === currentId ? ' current' : ''}" role="button" tabindex="0" data-pick="${a.id}" style="animation-delay:${i * 45}ms">
        <div class="itile"><div class="ico">${a.id === currentId ? icon('check', 18) : icon(a.icon, 20)}</div><div class="km">${esc(a.km)}</div></div>
        <div class="det">
          <div class="name-row"><span class="name">${esc(a.label)}</span><span class="pin">${icon('pin', 13)}</span></div>
          ${chip}
          <p class="full">${esc(a.full)}</p>
          <p class="phone-no">Phone number: <b>${MASKED_PHONE}</b></p>
          <div class="acts"><span class="act">${icon('more', 18)}</span><span class="act">${icon('share', 16)}</span></div>
        </div>
      </div>`;
  }

  function renderSheet(query = '') {
    const q = query.trim().toLowerCase();
    const list = ADDRESSES.filter(a => !q || (a.label + ' ' + a.full).toLowerCase().includes(q));
    const { live, off } = sorted(list);
    let html = '';
    let i = 0;
    if (live.length) {
      html += `<div class="group-label live">${icon('bolt', 13)}Bistro delivers here <span class="count">${live.length}</span></div>`;
      html += live.map(a => addrCard(a, i++)).join('');
    }
    if (off.length) {
      html += `<div class="group-label">${icon('clock', 13)}Not live yet <span class="count">${off.length}</span></div>`;
      html += off.map(a => addrCard(a, i++)).join('');
    }
    if (!html) html = `<p class="empty">No saved address matches "${esc(query)}"</p>`;
    $('#saved').innerHTML = html;
  }

  function openSheet(jumpToSaved) {
    $('#q').value = '';
    renderSheet();
    const scroller = $('#sheet-scroll');
    scroller.scrollTop = 0;
    phone.classList.add('sheet-open');
    if (jumpToSaved) {
      // "View all" lands straight on the saved list instead of the top actions.
      requestAnimationFrame(() => {
        const target = $('#saved');
        const head = $('.sheet-head').offsetHeight;
        scroller.scrollTo({ top: target.offsetTop - head, behavior: 'smooth' });
      });
    }
  }
  function closeSheet() { phone.classList.remove('sheet-open'); }

  function showScreen(id) {
    for (const s of phone.querySelectorAll('.screen')) s.hidden = s.id !== id;
    $('#' + id).scrollTop = 0;
  }

  let toastTimer;
  function toast(text, undo) {
    $('#toast-text').textContent = text;
    $('#toast-undo').hidden = !undo;
    const t = $('#toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function selectAddress(id, { silent } = {}) {
    if (id !== currentId) previousId = currentId;
    currentId = id;
    const a = byId(id);
    closeSheet();
    if (a.eta != null) {
      $('#home-eta').textContent = a.eta;
      $('#home-label').textContent = a.label;
      $('#home-addr').textContent = a.short;
      showScreen('home');
      if (!silent) toast(`Delivering to ${a.label} · ${a.eta} mins`, !!previousId);
    } else {
      document.querySelectorAll('[data-cur-addr]').forEach(el => el.textContent = a.short);
      renderCarousel();
      showScreen('landing');
      if (!silent) toast(`Bistro isn't live at ${a.label} yet`, !!previousId);
    }
  }

  document.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) { selectAddress(pick.dataset.pick); return; }
    const open = e.target.closest('[data-open-sheet]');
    if (open) { openSheet(open.dataset.openSheet === 'saved'); return; }
    if (e.target.closest('[data-close-sheet]')) closeSheet();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSheet();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.addr[data-pick]')) {
      e.preventDefault();
      selectAddress(e.target.dataset.pick);
    }
  });
  $('#q').addEventListener('input', e => renderSheet(e.target.value));
  $('#toast-undo').addEventListener('click', () => {
    $('#toast').classList.remove('show');
    if (previousId) selectAddress(previousId, { silent: true });
  });

  // Phones: scale the 360px-wide screen to the full width and stretch it to the full height,
  // so it runs edge to edge. Larger screens: fit the whole 360×780 screen inside a device frame.
  function fit() {
    const stage = $('.stage');
    const w = stage.clientWidth, h = stage.clientHeight;
    const compact = w < 520;
    document.body.classList.toggle('compact', compact);
    let sc, ph;
    if (compact) {
      sc = w / 360;
      ph = h / sc;
    } else {
      sc = Math.max(Math.min((w - 48) / 360, (h - 48) / 780, 1), 0.3);
      ph = 780;
    }
    const root = document.documentElement.style;
    root.setProperty('--s', sc.toFixed(4));
    root.setProperty('--ph', ph.toFixed(2) + 'px');
  }
  addEventListener('resize', fit);
  fit();

  renderCarousel();
</script>
</body>
