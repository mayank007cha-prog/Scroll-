<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonal Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,300..700,0..100&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap">
<style>
/* Layout: one Galaxy S24 screen (360 × 780 dp) drawn on a 1dp grid, the
   phone scales to fit; on a real phone it fills the viewport edge to edge.
   Colors are a dark tonal scheme pulled from the blue wallpaper, the way
   Android's dynamic color would derive them. */
:root {
  --page: #0b0e14;
  --ink: #f3f5fb;
  --ink-2: rgba(243, 245, 251, .74);
  --ink-3: rgba(243, 245, 251, .5);
  --surface: #1d2435;
  --surface-hi: #262f45;
  --primary: #b2c5ff;
  --primary-cont: #2b4274;
  --on-primary-cont: #dbe2ff;
  --inverse: #e4e8f4;
  --on-inverse: #1b2131;
  --search: rgba(40, 42, 47, .9);
  --tube: rgba(255, 255, 255, .07);
  --tube-edge: rgba(255, 255, 255, .1);
  --pill: rgba(14, 20, 36, .55);
  --font: "Google Sans Flex", "Roboto Flex", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- full-bleed screen ----------
   The wallpaper runs edge to edge on any display. Content lives in a
   phone-width column scaled by --dp (1dp = the smaller of width/360 and
   height/680), centred; home chrome hugs the bottom edge and the game is
   centred vertically with --gy. */
body { background: #1a3d73 url("wallpaper.jpg") center / cover no-repeat; }
.screen {
  --dp: clamp(.5px, min(100cqw / 360, 100cqh / 680), 2.2px);
  --gy: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  position: fixed; inset: 0;
  overflow: hidden;
  container-type: size;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.col {
  --edge: calc((100cqw - var(--dp) * 360) / -2 + env(safe-area-inset-right, 0px));
  position: absolute; top: 0; bottom: 0;
  left: calc(50% - var(--dp) * 180);
  width: calc(var(--dp) * 360);
}

/* status bar */
.status {
  position: absolute; inset: 0 0 auto 0;
  height: calc(var(--dp) * 36 + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--dp) * 2 + env(safe-area-inset-top, 0px)) max(calc(var(--dp) * 18), env(safe-area-inset-right, 0px)) 0 max(calc(var(--dp) * 18), env(safe-area-inset-left, 0px));
  font-size: calc(var(--dp) * 14); font-weight: 500; z-index: 15;
  font-variant-numeric: tabular-nums;
}
.status-icons { display: flex; align-items: center; gap: calc(var(--dp) * 5); }
.status-icons svg { height: calc(var(--dp) * 13); width: auto; display: block; }
.batt {
  display: inline-grid; place-items: center;
  height: calc(var(--dp) * 13); min-width: calc(var(--dp) * 23);
  padding: 0 calc(var(--dp) * 4);
  border-radius: calc(var(--dp) * 4.5);
  background: rgba(255, 255, 255, .9); color: #121620;
  font-size: calc(var(--dp) * 9.5); font-weight: 650; line-height: 1;
}

/* top-right action: overflow menu ⇄ close (shape-morph cross-fade) */
.top-action {
  position: absolute; z-index: 16;
  right: calc(var(--dp) * 10 + var(--edge)); top: calc(var(--dp) * 38);
  width: calc(var(--dp) * 48); height: calc(var(--dp) * 48);
  border-radius: 50%;
  display: grid; place-items: center;
  transition: opacity .28s cubic-bezier(.2, 0, 0, 1), transform .6s cubic-bezier(.2, 0, 0, 1), background-color .2s;
}
.top-action:active { background: rgba(255, 255, 255, .12); }
.top-action svg { width: calc(var(--dp) * 20); height: calc(var(--dp) * 20); }
#closeBtn { top: calc(var(--dp) * 37); opacity: 0; transform: rotate(-90deg) scale(.6); pointer-events: none; }
.is-game #moreBtn { opacity: 0; transform: rotate(90deg) scale(.6); pointer-events: none; }
.is-game #closeBtn { opacity: 1; transform: none; pointer-events: auto; }

/* app tokens: one layer shared by the home grid and the game */
.apps { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.app {
  position: absolute; left: 0; top: 0;
  width: calc(var(--dp) * 64); height: calc(var(--dp) * 64);
  transform-origin: 50% 50%;
  will-change: transform;
  pointer-events: auto;
  transition: opacity .3s cubic-bezier(.2, 0, 0, 1), filter .3s;
}
.app img {
  display: block; width: 100%; height: 100%;
  -webkit-user-drag: none; pointer-events: none;
  transition: transform .4s cubic-bezier(.2, 0, 0, 1), filter .4s;
}
.app .label {
  position: absolute; left: 50%; top: calc(var(--dp) * 67);
  width: calc(var(--dp) * 84); margin-left: calc(var(--dp) * -42);
  text-align: center; font-size: calc(var(--dp) * 12.5); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  transition: opacity .18s cubic-bezier(.2, 0, 0, 1);
}
.app.is-pressed img { transform: scale(.94); }
.is-game .app { pointer-events: none; }
.is-game .app .label { opacity: 0; transition-duration: .2s; }
.app .label { transition-delay: .35s; }
.is-game .app .label { transition-delay: 0s; }
.app.is-out { opacity: 0; }
.app.is-lifted { z-index: 3; }
.app.is-lifted img { filter: drop-shadow(0 calc(var(--dp) * 12) calc(var(--dp) * 16) rgba(0, 0, 0, .24)); }

/* home chrome */
.pager, .search {
  transition: opacity .3s cubic-bezier(.2, 0, 0, 1), transform .45s cubic-bezier(.2, 0, 0, 1);
}
.pager {
  position: absolute; z-index: 3;
  left: calc(var(--dp) * 126.3); bottom: calc(var(--dp) * 100.2 + var(--safe-b));
  display: flex; gap: calc(var(--dp) * 9.9);
}
.pager i { width: calc(var(--dp) * 6.8); height: calc(var(--dp) * 6.8); border-radius: 50%; background: rgba(255, 255, 255, .5); }
.pager i.on { background: #fff; }
.search {
  position: absolute; z-index: 3;
  left: calc(var(--dp) * 58.3); bottom: calc(var(--dp) * 25.1 + var(--safe-b));
  width: calc(var(--dp) * 243.4); height: calc(var(--dp) * 51.2);
  border-radius: calc(var(--dp) * 26);
  background: var(--search);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 calc(var(--dp) * 17) 0 calc(var(--dp) * 18);
  font-size: calc(var(--dp) * 16); color: rgba(255, 255, 255, .86);
}
.search span { display: flex; align-items: center; gap: calc(var(--dp) * 10); }
.search svg { width: calc(var(--dp) * 19); height: calc(var(--dp) * 19); }
.is-game .pager, .is-game .search { opacity: 0; transform: translateY(calc(var(--dp) * 16)); pointer-events: none; }

.nav-handle {
  position: absolute; z-index: 15;
  left: calc(var(--dp) * 117); bottom: calc(var(--dp) * 5.1 + var(--safe-b));
  width: calc(var(--dp) * 126); height: calc(var(--dp) * 3.7);
  border-radius: 99px; background: rgba(255, 255, 255, .85);
}

/* tubes: glass test tubes drawn in SVG */
.tubes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.tube {
  position: absolute; top: calc(var(--dp) * 337.6 + var(--gy));
  width: calc(var(--dp) * 72.2); height: calc(var(--dp) * 303.4);
  opacity: 0; transform: translateY(calc(var(--dp) * 18));
  transition: opacity .6s cubic-bezier(.2, 0, 0, 1), transform .9s cubic-bezier(.2, 0, 0, 1);
  pointer-events: none;
}
.tube svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tube .edge { fill: none; stroke: rgba(255, 255, 255, .2); stroke-width: 1; transition: stroke .3s; }
.tube .lip { fill: rgba(255, 255, 255, .07); stroke: rgba(255, 255, 255, .3); stroke-width: 1; }
.tube .tint { opacity: 0; transition: opacity 1.2s cubic-bezier(.2, 0, 0, 1); }
.is-game .tube { opacity: 1; transform: none; }
.is-game .tube:nth-child(2) { transition-delay: .05s; }
.is-game .tube:nth-child(3) { transition-delay: .1s; }
.is-game .tube:nth-child(4) { transition-delay: .15s; }
.tube.is-target .edge { stroke: rgba(255, 255, 255, .5); }
.is-won .tube .tint { opacity: 1; }

/* a soft dim that settles over the wallpaper while playing */
.dim {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 58%, rgba(6, 10, 24, .1), rgba(6, 10, 24, .38));
  opacity: 0; transition: opacity .8s cubic-bezier(.2, 0, 0, 1);
}
.is-game .dim { opacity: 1; }

/* pointer surface for the game */
.hit { position: absolute; left: 0; right: 0; top: calc(var(--dp) * 236 + var(--gy)); height: calc(var(--dp) * 420); z-index: 6; touch-action: none; display: none; }
.is-game .hit { display: block; }

/* HUD: hint → timer → reshuffle */
.hud { position: absolute; inset: 0; z-index: 7; pointer-events: none; text-align: center; }
.hint, .clock {
  position: absolute; left: 0; right: 0; margin: 0;
  opacity: 0; transform: translateY(calc(var(--dp) * 6));
  transition: opacity .5s cubic-bezier(.2, 0, 0, 1), transform .8s cubic-bezier(.2, 0, 0, 1);
}
.hint {
  top: calc(var(--dp) * 140 + var(--gy));
  font-size: calc(var(--dp) * 19.5); line-height: calc(var(--dp) * 25);
  font-weight: 300; color: var(--ink-2); letter-spacing: .005em;
  text-wrap: balance;
}
.clock { top: calc(var(--dp) * 145.4 + var(--gy)); display: grid; justify-items: center; gap: calc(var(--dp) * 3); }
.clock .time {
  font-size: calc(var(--dp) * 22); line-height: calc(var(--dp) * 24); font-weight: 300;
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.clock .best.is-new { color: var(--primary); }
.clock .best { font-size: calc(var(--dp) * 12); line-height: calc(var(--dp) * 14); color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.is-game.hud-hint .hint, .is-game.hud-clock .clock { opacity: 1; transform: none; }
.is-game.hud-hint .hint { transition-delay: .25s; }

.reshuffle {
  position: absolute; left: 50%; top: calc(var(--dp) * 224.4 + var(--gy));
  height: calc(var(--dp) * 28); padding: 0 calc(var(--dp) * 13);
  border-radius: 99px;
  display: inline-flex; align-items: center; gap: calc(var(--dp) * 6);
  background: rgba(255, 255, 255, .1);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22);
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  font-size: calc(var(--dp) * 12); font-weight: 500; letter-spacing: .03em;
  opacity: 0; transform: translateX(-50%) translateY(calc(var(--dp) * 6)); pointer-events: none;
  transition: opacity .6s cubic-bezier(.2, 0, 0, 1), transform .8s cubic-bezier(.2, 0, 0, 1), background-color .25s;
}
.reshuffle::before { content: ""; position: absolute; inset: calc(var(--dp) * -10) calc(var(--dp) * -8); }
.reshuffle svg { width: calc(var(--dp) * 12); height: calc(var(--dp) * 12); opacity: .85; }
.reshuffle:active { background: rgba(255, 255, 255, .2); }
.show-reshuffle .reshuffle { opacity: 1; transform: translateX(-50%); pointer-events: auto; }

.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; }

/* overflow menu: one frosted-glass panel, as in the Figma frame */
.scrim { position: absolute; inset: 0; z-index: 17; display: none; }
.menu-open .scrim { display: block; }
.menu {
  position: absolute; z-index: 18;
  right: calc(var(--dp) * 18 + var(--edge)); top: calc(var(--dp) * 46.8);
  width: calc(var(--dp) * 157.6);
  padding: calc(var(--dp) * 10) 0;
  border-radius: calc(var(--dp) * 24);
  background: rgba(10, 14, 26, .66);
  -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5);
  box-shadow: 0 calc(var(--dp) * 14) calc(var(--dp) * 40) rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .07);
  display: grid;
  transform-origin: 88% 6%;
  opacity: 0; transform: scale(.92);
  pointer-events: none;
  transition: opacity .22s cubic-bezier(.2, 0, 0, 1), transform .45s cubic-bezier(.2, 0, 0, 1);
}
.menu-open .menu { opacity: 1; transform: none; pointer-events: auto; }
.menu-item {
  display: flex; align-items: center;
  min-height: calc(var(--dp) * 44);
  padding: 0 calc(var(--dp) * 14) 0 calc(var(--dp) * 23);
  white-space: nowrap;
  text-align: left; font-size: calc(var(--dp) * 16); font-weight: 400; letter-spacing: .005em;
  color: rgba(255, 255, 255, .94);
  opacity: 0; transform: translateY(calc(var(--dp) * -3));
  transition: opacity .3s cubic-bezier(.2, 0, 0, 1), transform .45s cubic-bezier(.2, 0, 0, 1), background-color .2s;
}
.menu-item:hover, .menu-item:focus-visible { background: rgba(255, 255, 255, .06); outline: none; }
.menu-item:active { background: rgba(255, 255, 255, .11); }
.menu-open .menu-item { opacity: 1; transform: none; }
.menu-open .menu-item:nth-child(2) { transition-delay: .03s; }
.menu-open .menu-item:nth-child(3) { transition-delay: .06s; }
.menu-open .menu-item:nth-child(4) { transition-delay: .09s; }

.snack {
  position: absolute; z-index: 19; left: calc(var(--dp) * 16); right: calc(var(--dp) * 16); bottom: calc(var(--dp) * 92 + var(--safe-b));
  padding: calc(var(--dp) * 13) calc(var(--dp) * 16);
  border-radius: calc(var(--dp) * 14);
  background: var(--inverse); color: var(--on-inverse);
  font-size: calc(var(--dp) * 13.5); line-height: 1.35;
  opacity: 0; transform: translateY(calc(var(--dp) * 14)); pointer-events: none;
  transition: opacity .3s cubic-bezier(.2, 0, 0, 1), transform .5s cubic-bezier(.2, 0, 0, 1);
}
.snack.on { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .screen *, .screen *::after { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<main class="screen" id="screen">

        <div class="status" aria-hidden="true">
          <span id="clockNow">1:06</span>
          <span class="status-icons">
            <svg viewBox="0 0 18 14" fill="#fff"><path d="M9 13.2 .6 4.6a12 12 0 0 1 16.8 0Z" opacity=".95"/></svg>
            <svg viewBox="0 0 16 14" fill="#fff"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="4.3" y="6" width="3" height="8" rx="1"/><rect x="8.6" y="3" width="3" height="11" rx="1"/><rect x="12.9" y="0" width="3" height="14" rx="1" opacity=".45"/></svg>
            <span class="batt">16</span>
          </span>
        </div>

        <div class="dim" aria-hidden="true"></div>
        <div class="scrim" id="scrim"></div>
        <div class="col" id="col">
        <button class="top-action" id="moreBtn" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 20 20" fill="#fff"><circle cx="10" cy="3.2" r="1.9"/><circle cx="10" cy="10" r="1.9"/><circle cx="10" cy="16.8" r="1.9"/></svg>
        </button>
        <button class="top-action" id="closeBtn" aria-label="Close Tonal Sort" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l12 12M16 4 4 16"/></svg>
        </button>

        <div class="tubes" id="tubes"></div>
        <div class="apps" id="apps"></div>
        <div class="hit" id="hit"></div>

        <div class="hud">
          <p class="hint">Put same color family<br>icons together</p>
          <div class="clock">
            <span class="time" id="time">00:00</span>
            <span class="best" id="best">Best --:--</span>
          </div>
          <button class="reshuffle" id="reshuffle" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            Reshuffle
          </button>
        </div>
        <canvas class="fx" id="fx"></canvas>

        <div class="pager" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
        <div class="search" aria-hidden="true">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            Search
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </div>
        <div class="nav-handle" aria-hidden="true"></div>

        <div class="menu" id="menu" role="menu" aria-label="Home screen options">
          <button class="menu-item" role="menuitem" tabindex="-1" id="sortBtn">Sort</button>
          <button class="menu-item" role="menuitem" tabindex="-1" data-soon="Clean up pages">Clean up pages</button>
          <button class="menu-item" role="menuitem" tabindex="-1" data-soon="Settings">Settings</button>
          <button class="menu-item" role="menuitem" tabindex="-1" id="playBtn">Play</button>
        </div>
        <div class="snack" id="snack" role="status"></div>
        </div>
</main>

<script>
(() => {
  "use strict";

  // Home screen apps in grid order. `tone` is a fallback used only when the
  // icon pixels can't be read (e.g. opened from file://).
  const APPS = [
    { id: "whatsapp", name: "WhatsApp", tone: "green" },
    { id: "facebook", name: "Facebook", tone: "blue" },
    { id: "playstore", name: "Play Store", tone: "white" },
    { id: "swiggy", name: "Swiggy", tone: "orange" },
    { id: "phone", name: "Phone", tone: "green" },
    { id: "truecaller", name: "Truecaller", tone: "blue" },
    { id: "chatgpt", name: "ChatGPT", tone: "white" },
    { id: "letsrentz", name: "Lets Rentz", tone: "orange" },
    { id: "bistro", name: "Bistro", tone: "green" },
    { id: "porter", name: "Porter", tone: "blue" },
    { id: "myjio", name: "MyJio", tone: "white" },
    { id: "turbovpn", name: "Turbo VPN", tone: "orange" },
    { id: "toing", name: "toing", tone: "green" },
    { id: "primevideo", name: "Prime Video", tone: "blue" },
    { id: "delhivery", name: "Delhivery", tone: "white" },
    { id: "cleartrip", name: "Cleartrip", tone: "orange" },
  ];

  const FAMILY = {
    green: { label: "Green", color: "#2fbf6a" },
    blue: { label: "Blue", color: "#3b7bf0" },
    white: { label: "White", color: "#eef0f5" },
    orange: { label: "Orange", color: "#f0703a" },
    red: { label: "Red", color: "#e5484d" },
    yellow: { label: "Yellow", color: "#f4c542" },
    teal: { label: "Teal", color: "#1fb5b0" },
    purple: { label: "Purple", color: "#8e6cf0" },
    pink: { label: "Pink", color: "#ec5fa6" },
    black: { label: "Black", color: "#2a2d34" },
    grey: { label: "Grey", color: "#9aa0ab" },
  };

  // Geometry in dp on a 360 × 780 screen, taken from the Figma frames.
  const ICON = 64;
  // The bottom slot sits in the round end of the tube (its center is the arc center).
  const TUBE = { x0: 24, pitch: 80, w: 72.2, top: 337.6, h: 303.4, slot: 56.6, bottomCy: 268.5, cap: 5, iconScale: 56.6 / 64 };
  const homePos = (i) => ({ cx: 55.5 + 83 * (i % 4), cy: 125 + 94 * Math.floor(i / 4), s: 1, r: 0 });
  const tubeCx = (i) => TUBE.x0 + TUBE.w / 2 + TUBE.pitch * i;
  const slotPos = (i, k) => ({ cx: tubeCx(i), cy: TUBE.top + GY + TUBE.bottomCy - TUBE.slot * k, s: TUBE.iconScale, r: 0 });
  const liftPos = (i) => ({ cx: tubeCx(i), cy: 296 + GY, s: 1, r: -7 });

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- motion ----------
  // Every move is one continuous animation along a curved path, sampled into
  // keyframes, so speed never jumps between stages and nothing overshoots.
  function cubicBezier(x1, y1, x2, y2) {
    const f = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
    return (x) => {
      let lo = 0, hi = 1, t = x;
      for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; if (f(x1, x2, t) < x) lo = t; else hi = t; }
      return f(y1, y2, t);
    };
  }
  const EASE = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    // starts from rest and settles slowly: no jolt on tap, no overshoot
    out: cubicBezier(0.3, 0, 0.1, 1),
  };

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const screen = $("screen"), col = $("col"), appsEl = $("apps"), tubesEl = $("tubes"), hit = $("hit");
  const timeEl = $("time"), bestEl = $("best"), fx = $("fx"), snackEl = $("snack");
  const moreBtn = $("moreBtn"), closeBtn = $("closeBtn"), menu = $("menu"), reshuffleBtn = $("reshuffle");
  let S = 0; // px per dp
  let GY = 0; // dp the game shifts down to sit centred on taller screens

  const tokens = APPS.map((app, index) => {
    const el = document.createElement("div");
    el.className = "app";
    const img = new Image();
    img.src = `icons/${app.id}.png`;
    img.alt = "";
    img.draggable = false;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = app.name;
    el.append(img, label);
    el.setAttribute("aria-label", app.name);
    appsEl.append(el);
    const t = { app, index, slot: index, el, img, fam: app.tone, pos: homePos(index), anim: null, seq: 0 };
    el.addEventListener("pointerdown", () => { if (mode === "home") el.classList.add("is-pressed"); });
    ["pointerup", "pointerleave", "pointercancel"].forEach((e) => el.addEventListener(e, () => el.classList.remove("is-pressed")));
    return t;
  });

  // Glass test tube in the tube's own 72.2 × 303.4 dp box: flared lip, straight
  // walls, round end. No backdrop blur, so 16 icons can fly over it at full frame rate.
  function tubeArt(i) {
    const body = "M3.5 10V270a32.6 32.6 0 0 0 65.2 0V10";
    return `<svg viewBox="0 0 72.2 303.4" aria-hidden="true">
        <defs>
          <linearGradient id="glass${i}" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
            <stop offset=".22" stop-color="#fff" stop-opacity=".06"/>
            <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
          </linearGradient>
          <linearGradient id="tint${i}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--tint, #fff)" stop-opacity="0"/>
            <stop offset=".55" style="stop-color:var(--tint, #fff)" stop-opacity=".16"/>
            <stop offset="1" style="stop-color:var(--tint, #fff)" stop-opacity=".46"/>
          </linearGradient>
          <linearGradient id="shine${i}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".18" stop-color="#fff" stop-opacity=".34"/>
            <stop offset=".75" stop-color="#fff" stop-opacity=".12"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${body}Z" fill="url(#glass${i})"/>
        <path class="tint" d="${body}Z" fill="url(#tint${i})"/>
        <path class="edge" d="${body}" vector-effect="non-scaling-stroke"/>
        <rect x="8.6" y="24" width="2.6" height="226" rx="1.3" fill="url(#shine${i})"/>
        <path d="M62.6 30V250" stroke="#fff" stroke-opacity=".07" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M13 283a26 26 0 0 0 22 13" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.4" stroke-linecap="round"/>
        <rect class="lip" x=".75" y="1" width="70.7" height="9" rx="4.5" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  const tubeEls = [0, 1, 2, 3].map((i) => {
    const b = document.createElement("button");
    b.className = "tube";
    b.innerHTML = tubeArt(i);
    b.tabIndex = -1;
    b.style.left = `calc(var(--dp) * ${TUBE.x0 + TUBE.pitch * i})`;
    b.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapTube(i); }
      if (e.key === "ArrowRight") tubeEls[Math.min(3, i + 1)].focus();
      if (e.key === "ArrowLeft") tubeEls[Math.max(0, i - 1)].focus();
    });
    tubesEl.append(b);
    return b;
  });

  // ---------- placing tokens ----------
  const toTransform = (p) =>
    `translate3d(${((p.cx - ICON / 2) * S).toFixed(2)}px, ${((p.cy - ICON / 2) * S).toFixed(2)}px, 0) rotate(${p.r}deg) scale(${p.s})`;

  // where the icon is right now, even mid-flight
  function currentPos(t) {
    if (!t.anim) return t.pos;
    const m = new DOMMatrix(getComputedStyle(t.el).transform);
    return { cx: m.e / S + ICON / 2, cy: m.f / S + ICON / 2, s: Math.hypot(m.a, m.b), r: (Math.atan2(m.b, m.a) * 180) / Math.PI };
  }
  function halt(t) {
    if (!t.anim) return;
    const p = currentPos(t);
    t.anim.cancel();
    t.anim = null;
    t.pos = p;
    t.el.style.transform = toTransform(p);
  }

  // Fly along a Bézier curve: `via` is one control point (quadratic) or two
  // (cubic), in dp. Sampled every ~6ms so the path stays round at any speed.
  function flyTo(t, p, { duration = 520, delay = 0, ease = EASE.inOut, via = null } = {}) {
    halt(t);
    const from = t.pos;
    const v = via ? [].concat(via) : [{ cx: (from.cx + p.cx) / 2, cy: (from.cy + p.cy) / 2 }];
    const [c1, c2] = v.length === 2 ? v : [v[0], v[0]];
    const n = Math.max(16, Math.round(duration / 6));
    const frames = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, e = ease(u), q = 1 - e;
      const w0 = q * q * q, w1 = 3 * q * q * e, w2 = 3 * q * e * e, w3 = e * e * e;
      const bez = v.length === 2
        ? (k) => w0 * from[k] + w1 * c1[k] + w2 * c2[k] + w3 * p[k]
        : (k) => q * q * from[k] + 2 * q * e * c1[k] + e * e * p[k];
      frames.push({
        offset: u,
        transform: toTransform({
          cx: bez("cx"),
          cy: bez("cy"),
          s: from.s + (p.s - from.s) * e,
          r: from.r + (p.r - from.r) * e,
        }),
      });
    }
    t.pos = p;
    t.el.style.transform = toTransform(p);
    const a = t.el.animate(frames, { duration: reduced ? 1 : duration, delay: reduced ? 0 : delay, easing: "linear", fill: "backwards" });
    t.anim = a;
    a.onfinish = () => { if (t.anim === a) t.anim = null; };
    return a;
  }
  function setNow(t, p) { halt(t); t.pos = p; t.el.style.transform = toTransform(p); }

  // a gentle arc that rises a little above the higher of the two points
  const arcVia = (a, b, lift = 36) => ({ cx: (a.cx + b.cx) / 2, cy: Math.min(a.cy, b.cy) - lift });

  // Where each icon belongs right now, from game state rather than pixels.
  function restingPos(t) {
    if (mode === "game") {
      if (lifted && lifted.t === t) return liftPos(lifted.from);
      for (let i = 0; i < 4; i++) { const k = tubes[i].indexOf(t); if (k >= 0) return slotPos(i, k); }
    }
    return homePos(t.slot);
  }

  // Re-place icons only when the scale or game offset really changes (rotation,
  // window resize, a phone's URL bar), so flights in progress aren't cut short.
  function relayout() {
    const nextS = col.clientWidth / 360;
    const nextGY = Math.max(-85, (screen.clientHeight / nextS - 780) / 2);
    if (Math.abs(nextS - S) > 0.001 || Math.abs(nextGY - GY) > 0.5) {
      S = nextS;
      GY = nextGY;
      screen.style.setProperty("--gy", `${(GY * S).toFixed(2)}px`);
      tokens.forEach((t) => {
        if (t.anim) { t.anim.cancel(); t.anim = null; }
        if (!(ptr && ptr.dragging && ptr.cand === t)) t.pos = restingPos(t);
        t.el.style.transform = toTransform(t.pos);
      });
    }
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    fx.width = Math.round(col.clientWidth * dpr);
    fx.height = Math.round(col.clientHeight * dpr);
  }

  // ---------- tone detection ----------
  // Sample a ring just inside the icon's edge: that's the background plate,
  // which is what reads as the icon's color on a home screen.
  function familyOf(r, g, b) {
    const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255;
    const l = (max + min) / 2, d = max - min;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (l > 0.74 && s < 0.25) return "white";
    if (l < 0.16) return "black";
    if (s < 0.18) return "grey";
    let h;
    const R = r / 255, G = g / 255, B = b / 255;
    if (max === R) h = ((G - B) / d) % 6; else if (max === G) h = (B - R) / d + 2; else h = (R - G) / d + 4;
    h = (h * 60 + 360) % 360;
    if (h < 12 || h >= 345) return "red";
    if (h < 42) return "orange";
    if (h < 68) return "yellow";
    if (h < 165) return "green";
    if (h < 195) return "teal";
    if (h < 255) return "blue";
    if (h < 300) return "purple";
    return "pink";
  }
  function detectTone(t) {
    try {
      const n = 66, c = document.createElement("canvas");
      c.width = c.height = n;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(t.img, 0, 0, n, n);
      const data = ctx.getImageData(0, 0, n, n).data;
      let r = 0, g = 0, b = 0, k = 0;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const inset = Math.min(x, y, n - 1 - x, n - 1 - y);
        if (inset < 4 || inset > 8) continue;
        const o = (y * n + x) * 4;
        if (data[o + 3] < 250) continue;
        r += data[o]; g += data[o + 1]; b += data[o + 2]; k++;
      }
      if (k > 20) t.fam = familyOf(r / k, g / k, b / k);
    } catch (e) { /* tainted canvas: keep the fallback tone */ }
  }
  tokens.forEach((t) => {
    if (t.img.complete && t.img.naturalWidth) detectTone(t);
    else t.img.addEventListener("load", () => detectTone(t), { once: true });
  });

  // ---------- game state ----------
  let mode = "home";
  let tubes = [[], [], [], []];
  let families = [];
  let lifted = null; // { t, from }
  let busyUntil = 0;
  let won = false;
  const timer = { start: 0, elapsed: 0, running: false, id: 0 };

  const rand = (n) => Math.floor(Math.random() * n);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  const busy = () => performance.now() < busyUntil;
  const lock = (ms) => { busyUntil = performance.now() + (reduced ? 0 : ms); };
  const haptic = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* not allowed */ } };

  let best = null;
  try { best = Number(localStorage.getItem("tonal-sort-best")) || null; } catch (e) { /* storage blocked */ }
  const saveBest = (ms) => { best = ms; try { localStorage.setItem("tonal-sort-best", String(ms)); } catch (e) { /* storage blocked */ } };

  // Pick any 4 color families that have at least 4 apps, then 4 apps from each.
  function pickApps() {
    const groups = {};
    tokens.forEach((t) => (groups[t.fam] ||= []).push(t));
    const eligible = shuffle(Object.keys(groups).filter((f) => groups[f].length >= 4));
    if (eligible.length < 4) return null;
    const fams = eligible.slice(0, 4);
    return { fams, picked: fams.flatMap((f) => shuffle(groups[f].slice()).slice(0, 4)) };
  }

  // With one spare slot per tube most random deals can't be solved, so scramble
  // backwards from a sorted board with legal moves. Stop on a board with 4 icons
  // per tube and no tube holding 3+ of one family (12+ moves from solved).
  function deal(picked) {
    const playable = (cols) => cols.every((c) => {
      if (c.length !== 4) return false;
      const n = {};
      c.forEach((t) => (n[t.fam] = (n[t.fam] || 0) + 1));
      return Math.max(...Object.values(n)) < 3;
    });
    const byFam = {};
    picked.forEach((t) => (byFam[t.fam] ||= []).push(t));
    for (;;) {
      const cols = shuffle(Object.values(byFam)).map((g) => shuffle(g.slice()));
      let last = null;
      for (let step = 0; step < 4000; step++) {
        const moves = [];
        for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
          if (a === b || !cols[a].length || cols[b].length >= TUBE.cap) continue;
          if (last && a === last[1] && b === last[0]) continue;
          moves.push([a, b]);
        }
        const [a, b] = moves[rand(moves.length)];
        cols[b].push(cols[a].pop());
        last = [a, b];
        if (step > 40 && playable(cols)) return cols;
      }
    }
  }

  function setHud(state) {
    screen.classList.toggle("hud-hint", state === "hint");
    screen.classList.toggle("hud-clock", state === "clock");
  }
  function renderBest(text) { bestEl.textContent = text ?? (best ? `Best ${fmt(best)}` : "Best --:--"); }
  function labelTubes() {
    tubeEls.forEach((b, i) => {
      const names = tubes[i].map((t) => t.app.name).reverse();
      const lift = lifted && lifted.from === i ? `, lifted ${lifted.t.app.name}` : "";
      b.setAttribute("aria-label", `Tube ${i + 1}: ${names.length ? names.join(", ") : "empty"}${lift}`);
    });
  }

  // timer starts on the first move, not when the board appears
  function startTimer() {
    if (timer.running || won) return;
    timer.running = true;
    timer.start = performance.now();
    setHud("clock");
    const tick = () => { timeEl.textContent = fmt(performance.now() - timer.start); };
    tick();
    timer.id = setInterval(tick, 250);
  }
  function stopTimer() {
    if (timer.running) timer.elapsed = performance.now() - timer.start;
    timer.running = false;
    clearInterval(timer.id);
  }

  function clearWin() {
    won = false;
    bestEl.classList.remove("is-new");
    screen.classList.remove("is-won", "show-reshuffle");
    reshuffleBtn.tabIndex = -1;
    tubeEls.forEach((b) => b.style.removeProperty("--tint"));
  }

  // Sort: reflow the home grid A–Z
  function sortApps() {
    const order = tokens.slice().sort((a, b) => a.app.name.localeCompare(b.app.name, undefined, { sensitivity: "base" }));
    order.forEach((t, i) => {
      const moved = t.slot !== i;
      t.slot = i;
      if (moved) flyTo(t, homePos(i), { duration: 640, delay: i * 18, via: arcVia(t.pos, homePos(i), 18) });
    });
  }

  // ---------- enter / leave ----------
  function enterGame() {
    if (mode !== "home") return;
    closeMenu(false);
    const pick = pickApps();
    if (!pick) { snack("Tonal Sort needs 4 colors with at least 4 apps each."); return; }
    mode = "game";
    families = pick.fams;
    tubes = deal(pick.picked);
    lifted = null;
    clearWin();
    timeEl.textContent = "00:00";
    renderBest();
    setHud("hint");
    screen.classList.add("is-game");
    closeBtn.tabIndex = 0; moreBtn.tabIndex = -1;
    tubeEls.forEach((b) => (b.tabIndex = 0));
    tokens.forEach((t) => t.el.classList.toggle("is-out", !pick.picked.includes(t)));
    // fall from the grid into the tubes: rise a touch, then settle in, in grid order
    requestAnimationFrame(() => tubes.forEach((col, i) => col.forEach((t, k) => {
      const to = slotPos(i, k);
      flyTo(t, to, { duration: 820, delay: 80 + t.slot * 34, via: { cx: (t.pos.cx + to.cx) / 2, cy: t.pos.cy - 24 } });
    })));
    labelTubes();
    lock(950);
    haptic(10);
  }

  function leaveGame() {
    if (mode !== "game") return;
    mode = "home";
    stopTimer();
    lifted = null;
    clearWin();
    setHud(null);
    screen.classList.remove("is-game");
    closeBtn.tabIndex = -1; moreBtn.tabIndex = 0;
    tubeEls.forEach((b) => { b.tabIndex = -1; b.classList.remove("is-target"); });
    tokens.forEach((t) => {
      t.el.classList.remove("is-out", "is-lifted");
      flyTo(t, homePos(t.slot), { duration: 720, delay: (15 - t.slot) * 16, via: arcVia(t.pos, homePos(t.slot), 30) });
    });
    moreBtn.focus({ preventScroll: true });
  }

  function reshuffle() {
    if (mode !== "game") return;
    stopTimer();
    clearWin();
    const pick = pickApps();
    families = pick.fams;
    tubes = deal(pick.picked);
    tokens.forEach((t) => t.el.classList.toggle("is-out", !pick.picked.includes(t)));
    timeEl.textContent = "00:00";
    renderBest();
    setHud("clock");
    tubes.forEach((col, i) => col.forEach((t, k) => {
      const to = slotPos(i, k);
      flyTo(t, to, { duration: 760, delay: Math.random() * 160, via: arcVia(t.pos, to, 70) });
    }));
    labelTubes();
    lock(600);
    haptic(10);
  }

  // ---------- moves ----------
  function lift(i) {
    const t = tubes[i].pop();
    lifted = { t, from: i };
    t.el.classList.add("is-lifted");
    flyTo(t, liftPos(i), { duration: 300, ease: EASE.out });
    startTimer();
    haptic(6);
  }
  function dropInto(i, viaHop = true) {
    const { t, from } = lifted;
    lifted = null;
    tubes[i].push(t);
    const target = slotPos(i, tubes[i].length - 1);
    // glide across, then descend straight into the tube, as one S-curve
    const start = currentPos(t);
    const dx = target.cx - start.cx;
    const top = Math.min(start.cy, target.cy);
    flyTo(t, target, {
      duration: Math.round(Math.min(620, 300 + Math.abs(target.cy - start.cy) * 0.5 + Math.abs(dx) * 0.55)),
      ease: viaHop ? EASE.inOut : EASE.out,
      via: [{ cx: start.cx + dx * 0.55, cy: top - 10 }, { cx: target.cx, cy: top - 4 }],
    });
    setTimeout(() => t.el.classList.remove("is-lifted"), 260);
    haptic(12);
    labelTubes();
    if (i !== from) checkWin();
  }
  function reject(i) {
    tubeEls[i].animate(
      [{ transform: "translateX(0)" }, { transform: `translateX(${-3 * S}px)` }, { transform: `translateX(${2.5 * S}px)` }, { transform: `translateX(${-1 * S}px)` }, { transform: "translateX(0)" }],
      { duration: 420, easing: "cubic-bezier(.2,0,0,1)" }
    );
    haptic([6, 40, 6]);
  }
  function tapTube(i) {
    if (mode !== "game" || won || busy()) return;
    if (!lifted) { if (tubes[i].length) lift(i); labelTubes(); return; }
    if (i === lifted.from || tubes[i].length < TUBE.cap) dropInto(i);
    else reject(i);
  }

  function checkWin() {
    const solved = tubes.every((c) => c.length === 4 && c.every((t) => t.fam === c[0].fam));
    if (solved) celebrate();
  }

  function celebrate() {
    won = true;
    stopTimer();
    const ms = timer.elapsed;
    const isBest = !best || ms < best;
    if (isBest) saveBest(ms);
    timeEl.textContent = fmt(ms);
    renderBest(isBest ? "New best" : `Best ${fmt(best)}`);
    bestEl.classList.toggle("is-new", isBest);
    setTimeout(() => {
      tubes.forEach((col, i) => tubeEls[i].style.setProperty("--tint", FAMILY[col[0].fam].color));
      screen.classList.add("is-won");
      timeEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 800, easing: "cubic-bezier(.2,0,0,1)" });
      confetti(180, 166 + GY);
      tubes.forEach((col, i) => col.forEach((t, k) => {
        t.img.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-3 * S}px) scale(1.02)` }, { transform: "translateY(0)" }],
          { duration: 700, delay: i * 90 + k * 45, easing: "cubic-bezier(.2,0,0,1)" });
      }));
      haptic([8, 60, 12]);
    }, reduced ? 0 : 520);
    setTimeout(() => {
      screen.classList.add("show-reshuffle");
      reshuffleBtn.tabIndex = 0;
    }, reduced ? 0 : 1750);
  }

  // ---------- confetti: Material 3 Expressive shapes in wallpaper colors ----------
  // The pieces are the soft shapes Android 16 uses across the system (cookie,
  // clover, sunny, pill, gem, soft triangle), colored from the wallpaper the way
  // dynamic color would: blue primary tones, the teal and the amber glow.
  const polar = (fn, n = 72) => {
    const path = new Path2D();
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2, r = fn(a);
      i ? path.lineTo(Math.cos(a) * r, Math.sin(a) * r) : path.moveTo(r, 0);
    }
    path.closePath();
    return path;
  };
  const pill = (() => { const p = new Path2D(); p.roundRect(-1.25, -0.55, 2.5, 1.1, 0.55); return p; })();
  const SHAPES = [
    polar((a) => 1 + 0.1 * Math.cos(7 * a)),    // cookie 7
    polar((a) => 1 + 0.22 * Math.cos(4 * a)),   // clover 4
    polar((a) => 1 + 0.07 * Math.cos(9 * a)),   // sunny
    polar((a) => 1 + 0.16 * Math.cos(3 * a)),   // soft triangle
    polar((a) => 1 + 0.18 * Math.cos(2 * a)),   // gem
    polar(() => 1),                              // circle
    pill,
  ];
  const PALETTE = [
    ["#b2c5ff", 3], // primary 80
    ["#dbe2ff", 2], // primary 90
    ["#8fd3df", 2], // teal from the lower wallpaper
    ["#f3cf7a", 2], // amber glow behind the icons
    ["#ffffff", 1],
  ].flatMap(([c, w]) => Array(w).fill(c));

  // damped spring 0 → 1 with a small overshoot (M3 expressive spatial spring)
  const springIn = (t, w = 24, z = 0.55) => {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
  };

  function confetti(cxDp, cyDp) {
    if (reduced) return;
    const ctx = fx.getContext("2d");
    const k = fx.width / 360; // canvas px per dp
    const N = 28;
    const parts = Array.from({ length: N }, (_, n) => {
      const a = (n / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
      return {
        a,
        r0: 22 + Math.random() * 6,
        dist: 30 + Math.random() * 34,
        size: 3.2 + Math.random() * 2.6,
        shape: SHAPES[n % SHAPES.length],
        color: PALETTE[rand(PALETTE.length)],
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 3.2,
        delay: Math.random() * 0.09,
      };
    });
    const life = 1.15; // seconds
    const t0 = performance.now();
    const frame = (now) => {
      const T = (now - t0) / 1000;
      ctx.clearRect(0, 0, fx.width, fx.height);

      // a soft ripple from behind the timer, like a touch ripple
      const rt = Math.min(1, T / 0.75);
      if (rt < 1) {
        const re = 1 - Math.pow(1 - rt, 3);
        ctx.save();
        ctx.globalAlpha = 0.32 * (1 - rt);
        ctx.strokeStyle = "#dbe2ff";
        ctx.lineWidth = 1.4 * k;
        ctx.beginPath();
        ctx.ellipse(cxDp * k, cyDp * k, (24 + 54 * re) * 1.22 * k, (24 + 54 * re) * k, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.1 * (1 - rt);
        ctx.fillStyle = "#b2c5ff";
        ctx.fill();
        ctx.restore();
      }

      for (const p of parts) {
        const t = T - p.delay;
        if (t <= 0) continue;
        const u = Math.min(1, t / life);
        const travel = 1 - Math.exp(-5.2 * t);            // fast out, eased to rest
        const r = p.r0 + p.dist * travel;
        const x = cxDp + Math.cos(p.a) * r * 1.22;
        const y = cyDp + Math.sin(p.a) * r + 9 * u * u;    // a whisper of gravity
        const grow = springIn(t);
        const shrink = u < 0.62 ? 1 : 1 - (u - 0.62) / 0.38;
        const sc = Math.max(0, grow * shrink) * p.size;
        if (sc <= 0.01) continue;
        ctx.save();
        ctx.globalAlpha = Math.min(1, shrink * 1.4) * 0.95;
        ctx.translate(x * k, y * k);
        ctx.rotate(p.rot + p.spin * (1 - Math.exp(-3 * t)));
        ctx.scale(sc * k, sc * k);
        ctx.fillStyle = p.color;
        ctx.fill(p.shape);
        ctx.restore();
      }
      if (T < life + 0.12) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, fx.width, fx.height);
    };
    requestAnimationFrame(frame);
  }

  // ---------- pointer: tap a tube, or drag its top icon ----------
  let ptr = null;
  const toDp = (e) => { const b = col.getBoundingClientRect(); return { x: (e.clientX - b.left) / S, y: (e.clientY - b.top) / S }; };
  const tubeAt = (x) => {
    const i = Math.floor((x - TUBE.x0 + 4) / TUBE.pitch);
    if (i < 0 || i > 3) return -1;
    const left = TUBE.x0 + TUBE.pitch * i;
    return x >= left - 4 && x <= left + TUBE.w + 4 ? i : -1;
  };
  const near = (p, q, d) => Math.hypot(p.x - q.cx, p.y - q.cy) < d;

  hit.addEventListener("pointerdown", (e) => {
    if (mode !== "game" || won || busy()) return;
    const p = toDp(e);
    const ti = tubeAt(p.x);
    let cand = null, src = -1;
    if (lifted && near(p, lifted.t.pos, 40)) { cand = lifted.t; src = lifted.from; }
    else if (!lifted && ti >= 0 && tubes[ti].length) { cand = tubes[ti][tubes[ti].length - 1]; src = ti; }
    ptr = { id: e.pointerId, start: p, ti, cand, src, dragging: false, over: -1 };
    hit.setPointerCapture(e.pointerId);
  });

  hit.addEventListener("pointermove", (e) => {
    if (!ptr || e.pointerId !== ptr.id || !ptr.cand) return;
    const p = toDp(e);
    if (!ptr.dragging) {
      if (Math.hypot(p.x - ptr.start.x, p.y - ptr.start.y) < 6) return;
      ptr.dragging = true;
      if (!lifted) {
        tubes[ptr.src].pop();
        lifted = { t: ptr.cand, from: ptr.src };
        startTimer();
        haptic(8);
      }
      ptr.cand.el.classList.add("is-lifted");
    }
    setNow(ptr.cand, { cx: p.x, cy: p.y - 10, s: 1.08, r: 0 });
    const over = tubeAt(p.x);
    if (over !== ptr.over) {
      if (ptr.over >= 0) tubeEls[ptr.over].classList.remove("is-target");
      if (over >= 0) tubeEls[over].classList.add("is-target");
      ptr.over = over;
    }
  });

  function endPointer(e, cancelled) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const st = ptr;
    ptr = null;
    if (st.over >= 0) tubeEls[st.over].classList.remove("is-target");
    if (st.dragging) {
      const target = cancelled ? -1 : tubeAt(toDp(e).x);
      if (target >= 0 && (target === lifted.from || tubes[target].length < TUBE.cap)) dropInto(target, false);
      else {
        if (target >= 0) reject(target);
        dropInto(lifted.from, false);
      }
      return;
    }
    if (cancelled) return;
    if (st.ti >= 0) tapTube(st.ti);
    else if (lifted) dropInto(lifted.from);
  }
  hit.addEventListener("pointerup", (e) => endPointer(e, false));
  hit.addEventListener("pointercancel", (e) => endPointer(e, true));

  // ---------- menu ----------
  const items = [...menu.querySelectorAll(".menu-item")];
  function openMenu() {
    screen.classList.add("menu-open");
    moreBtn.setAttribute("aria-expanded", "true");
    items.forEach((b) => (b.tabIndex = 0));
    setTimeout(() => items[0].focus({ preventScroll: true }), 40);
  }
  function closeMenu(refocus = true) {
    if (!screen.classList.contains("menu-open")) return;
    screen.classList.remove("menu-open");
    moreBtn.setAttribute("aria-expanded", "false");
    items.forEach((b) => (b.tabIndex = -1));
    if (refocus) moreBtn.focus({ preventScroll: true });
  }
  moreBtn.addEventListener("click", () => (screen.classList.contains("menu-open") ? closeMenu() : openMenu()));
  $("scrim").addEventListener("pointerdown", () => closeMenu(false));
  $("playBtn").addEventListener("click", enterGame);
  $("sortBtn").addEventListener("click", () => { closeMenu(); sortApps(); });
  items.forEach((b) => {
    if (!b.dataset.soon) return;
    b.addEventListener("click", () => { closeMenu(); snack(`${b.dataset.soon} isn't part of this prototype. Tap Play to try the game.`); });
  });
  menu.addEventListener("keydown", (e) => {
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  });

  closeBtn.addEventListener("click", leaveGame);
  reshuffleBtn.addEventListener("click", reshuffle);

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (screen.classList.contains("menu-open")) closeMenu();
    else if (lifted) dropInto(lifted.from);
    else leaveGame();
  });

  let snackTimer = 0;
  function snack(msg) {
    snackEl.textContent = msg;
    snackEl.classList.add("on");
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackEl.classList.remove("on"), 2600);
  }

  // live status-bar clock
  const nowEl = $("clockNow");
  const tickClock = () => {
    const d = new Date();
    nowEl.textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  tickClock();
  setInterval(tickClock, 15000);
  // home screen starts sorted A–Z; then size everything to this screen
  tokens.slice()
    .sort((a, b) => a.app.name.localeCompare(b.app.name, undefined, { sensitivity: "base" }))
    .forEach((t, i) => (t.slot = i));
  new ResizeObserver(relayout).observe(screen);
  relayout();
})();
</script>
</body>
</html>
