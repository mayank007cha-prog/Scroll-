<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScrollTrigger — Scroll Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
        }

        /* Each slide is a full-viewport layer. Only the active one, the one
           it just came from (receded, sitting behind it) and the one about
           to enter (parked off-screen left) ever differ from their resting
           "parked" position — see main.js's syncRoles(). */
        .Slide {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0b0d;
            transform: translateX(-100%);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1), opacity 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Transitions are only enabled once JS has set the correct initial
           roles, so the first paint never animates in from off-screen. */
        .Deck:not(.is-ready) .Slide {
            transition: none;
        }

        .Slide.is-active {
            transform: translateX(0) scale(1);
            opacity: 1;
            z-index: 2;
        }

        .Slide.is-receded {
            transform: translateX(0) scale(0.85);
            opacity: 0.35;
            z-index: 1;
        }

        video.Slide-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .Slide-index {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
<div class="Deck" id="deck">
    <section class="Slide is-active" data-index="0">
        <video class="Slide-video" src="assets/hero-video.mp4" muted playsinline preload="auto"></video>
    </section>
    <section class="Slide" data-index="1"><span class="Slide-index">02</span></section>
    <section class="Slide" data-index="2"><span class="Slide-index">03</span></section>
    <section class="Slide" data-index="3"><span class="Slide-index">04</span></section>
    <section class="Slide" data-index="4"><span class="Slide-index">05</span></section>
    <section class="Slide is-receded" data-index="5"><span class="Slide-index">06</span></section>
</div>
<script src="main.js"></script>
</body>
</html>
